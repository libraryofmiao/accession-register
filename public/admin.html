<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Staff Administration — SDLM Miao</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <div><strong>SDLM Miao</strong><span> Staff Administration</span></div>
    <button id="logoutButton" class="secondary" type="button">Logout</button>
  </header>

  <main class="admin-shell">
    <section class="panel">
      <div class="panel-heading">
        <div><h1>New Accession</h1><p>Enter a new library accession record.</p></div>
        <span id="staffName" class="staff-name"></span>
      </div>

      <form id="accessionForm" class="accession-form">
        <div class="section-title">Basic information</div>
        <div class="grid two">
          <label>Accession No.*
            <div class="input-with-button">
              <input id="accessionNo" name="accession_no" required readonly>
              <button type="button" id="refreshAccession" class="small-button">Next</button>
            </div>
          </label>
          <label>Accession Date<input name="accession_date" id="accessionDate" type="date"></label>
        </div>
        <label>Title*<input name="title" required></label>
        <label>Subtitle<input name="subtitle"></label>

        <div class="section-title">Authors — maximum 3</div>
        <div id="authors" class="author-list">
          <label>Main Author<input name="author1"></label>
        </div>
        <button type="button" id="addAuthor" class="small-button">+ Add Author</button>

        <div class="section-title">Contributors</div>
        <div id="contributors" class="contributor-list">
          <div class="contributor-row">
            <input name="contributor1" placeholder="Contributor name">
            <input name="contributor_role1" placeholder="Role (optional)">
          </div>
        </div>
        <button type="button" id="addContributor" class="small-button">+ Add Contributor</button>

        <div class="section-title">Publication details</div>
        <div class="grid two">
          <label>Edition<input name="edition"></label>
          <label>Publisher<input name="publisher"></label>
          <label>Publication Place<input name="publication_place"></label>
          <label>Publication Year<input name="publication_year" type="number" min="0" max="9999"></label>
          <label>ISBN<input name="isbn"></label>
          <label>Pages<input name="pages"></label>
          <label>Price<input name="price" type="number" min="0" step="0.01"></label>
          <label>Language<input name="language"></label>
          <label>Book Type<input name="book_type"></label>
          <label>Status<select name="status"><option>Available</option><option>Issued</option><option>Lost</option><option>Withdrawn</option><option>Damaged</option></select></label>
        </div>

        <div class="section-title">Classification & location</div>
        <div class="grid two">
          <label>DDC Number
            <input id="ddcNumber" name="ddc_number" autocomplete="off">
            <div id="ddcSuggestions" class="suggestions"></div>
          </label>
          <label>Subject<input id="subject" name="subject"></label>
          <label>Location<select id="location" name="location_id"><option value="">Select location</option></select></label>
        </div>

        <label>Remarks<textarea name="remarks" rows="3"></textarea></label>
        <div id="formMessage" class="form-message"></div>
        <button class="primary" type="submit">Save Accession</button>
      </form>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
