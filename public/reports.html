<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports — SDLM Miao</title><link rel="stylesheet" href="/admin.css"><style>.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{border:1px solid #d8dee8;border-radius:12px;padding:18px;background:#fff}.num{font-size:32px;font-weight:700}</style></head><body class="admin-page"><header class="admin-header"><div><strong>SDLM Miao</strong><span> Reports</span></div><a href="/admin">Dashboard</a></header><main class="admin-shell"><section class="panel"><h1>Reports &amp; Statistics</h1><div class="stats"><div class="stat"><div class="num" id="accessions">—</div><div>Accession records</div></div><div class="stat"><div class="num" id="ddc">—</div><div>DDC master records</div></div><div class="stat"><div class="num" id="locations">—</div><div>Location records</div></div></div><p id="msg"></p></section></main><script>fetch('/api/admin/enhancements/reports/summary').then(r=>r.json()).then(x=>{accessions.textContent=x.accessions;ddc.textContent=x.ddc;locations.textContent=x.locations}).catch(e=>msg.textContent=e.message)</script></body></html>
