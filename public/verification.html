<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physical Verification</title><style>body{font-family:system-ui;margin:24px;max-width:1100px}button,input,select{padding:9px;margin:4px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0}.muted{color:#666}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}</style></head>
<body><h1>Physical Verification</h1><div class="card"><label>Section <input id="section"></label><label>Rack <input id="rack"></label><label>Shelf <input id="shelf"></label><button id="start">Start Verification</button></div><div id="session" class="card" hidden><div class="grid"><button data-result="FOUND">Found</button><button data-result="MISSING">Missing</button><button data-result="DAMAGED">Damaged</button><button data-result="WRONG_LOCATION">Wrong Location</button></div><p class="muted">Search or scan an accession number, then record its physical result.</p><input id="search" placeholder="Accession number / title"><button id="searchBtn">Search</button><div id="results"></div><button id="complete">Complete Verification</button></div><script>
let token=sessionStorage.getItem('token')||localStorage.getItem('token'),sessionId=null,selected=null;
const headers=()=>({"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{})});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||`HTTP ${r.status}`);return d}
document.getElementById('start').onclick=async()=>{try{const d=await api('/api/admin/verification/sessions',{method:'POST',body:JSON.stringify({section:document.getElementById('section').value,rack:document.getElementById('rack').value,shelf:document.getElementById('shelf').value})});sessionId=d.session?.id||d.id;document.getElementById('session').hidden=false;alert('Verification session started.')}catch(e){alert(e.message)}};
document.getElementById('searchBtn').onclick=async()=>{if(!sessionId)return alert('Start a session first');const q=document.getElementById('search').value.trim();if(!q)return;try{const d=await api(`/api/admin/register?search=${encodeURIComponent(q)}&limit=25`);const rows=d.data||d.records||[];document.getElementById('results').innerHTML='<table><thead><tr><th>Accession</th><th>Title</th><th>Location</th><th>Action</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${x.accession_number||x.accession_no||''}</td><td>${x.title||''}</td><td>${x.location_name||x.location||''}</td><td><button onclick="selectItem('${x.id}')">Select</button></td></tr>`).join('')+'</tbody></table>'}catch(e){alert(e.message)}};
window.selectItem=async id=>{selected=id;document.querySelectorAll('[data-result]').forEach(b=>b.onclick=async()=>{if(!selected)return alert('Select a record first');try{await api(`/api/admin/verification/sessions/${sessionId}/items`,{method:'POST',body:JSON.stringify({accession_id:selected,result:b.dataset.result,notes:''})});alert('Verification result recorded.')}catch(e){alert(e.message)}});alert('Record selected. Choose Found, Missing, Damaged or Wrong Location.');};
document.getElementById('complete').onclick=async()=>{if(!sessionId)return;try{await api(`/api/admin/verification/sessions/${sessionId}/complete`,{method:'POST'});alert('Verification session completed.');location.reload()}catch(e){alert(e.message)}};
</script></body></html>
