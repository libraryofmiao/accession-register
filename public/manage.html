<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accession Management — SDLM Miao</title><link rel="stylesheet" href="/manage.css"><style>.page-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.page-nav a{padding:8px 12px;border:1px solid #d8dee8;border-radius:8px;text-decoration:none;color:inherit;background:#fff}.page-nav a:hover{background:#f5f7fa}</style></head><body><header class="admin-header"><div><h1>Accession Management</h1><p>Sub Divisional Library, Miao</p></div><nav><a href="/admin">Dashboard</a><a href="/register.html">Accession Register</a><a href="/masters">Masters</a><a href="/">Public OPAC</a><button id="logout">Logout</button></nav></header><main class="admin-main"><section class="panel"><div class="panel-title"><div><h2>Search Accession Register</h2><p>Search by accession number, title, author, ISBN or DDC.</p></div></div><form id="searchForm" class="search-row"><input id="q" placeholder="Search accession records…" autocomplete="off"><button>Search</button></form></section><section class="panel"><div id="message"></div><div id="records"></div></section><section id="editorPanel" class="panel hidden"><div class="panel-title"><h2>Edit Accession</h2><button type="button" id="closeEditor">Close</button></div><form id="editor"><input type="hidden" id="id"><div class="form-grid"><label>Accession No.<input id="accession_no" readonly></label><label>Accession Date<input id="accession_date" type="date"></label><label class="wide">Title<input id="title" required></label><label class="wide">Subtitle<input id="subtitle"></label><label>Edition<input id="edition"></label><label>Publisher<input id="publisher"></label><label>Publication Place<input id="publication_place"></label><label>Publication Year<input id="publication_year" type="number"></label><label>ISBN<input id="isbn"></label><label>Pages<input id="pages"></label><label>Price<input id="price" type="number" step="0.01"></label><label>Language<input id="language"></label><label>Book Type<input id="book_type"></label><label>DDC Number<input id="ddc_number"></label><label>Subject<input id="subject"></label><label>Location<select id="location_id"><option value="">— No location —</option></select></label><label>Status<select id="status"><option>Available</option><option>Issued</option><option>Lost</option><option>Withdrawn</option><option>Damaged</option></select></label><label class="wide">Remarks<textarea id="remarks"></textarea></label></div><h3>Authors (maximum 3)</h3><div id="authors"></div><button type="button" id="addAuthor">Add Author</button><h3>Contributors</h3><div id="contributors"></div><button type="button" id="addContributor">Add Contributor</button><div class="form-actions"><button type="submit">Save Changes</button><button type="button" id="deleteRecord" class="danger">Delete Record</button></div></form></section></main><script src="/manage.js"></script></body></html>
